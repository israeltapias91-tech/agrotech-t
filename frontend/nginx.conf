# Nginx: sirve el build Vite y proxya la API al backend en el MISMO origen.
# Mismo origen => la cookie sessionid (SameSite=Lax) viaja sin fricción CORS.
upstream django {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    # Estáticos del build Vite con caché larga (nombres con hash).
    location /assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API + admin + estáticos Django hacia el backend.
    location /api/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /admin/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Estáticos Django (collectstatic del backend, volumen compartido).
    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # SPA: cualquier otra ruta sirve index.html (React Router la resuelve).
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
