# AGROTECH — entorno Docker local (validación, NO producción pública).
# Internet -> Nginx (:8080, mismo origen frontend+API) -> Django -> MariaDB.
# La MariaDB de Docker vive aislada y publica 3308 para NO chocar con Laragon (3307).
# Sin secretos en el repo: todo via ${VAR:-defecto} o backend/.env.docker (no commitear).

services:
  db:
    image: mariadb:11.8
    container_name: agrotech-db
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_DATABASE: ${DB_NAME:-agrotech_db}
      MARIADB_USER: ${DB_USER:-agrotech}
      MARIADB_PASSWORD: ${DB_PASSWORD:-agrotech-docker-local}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-agrotech-root-docker-local}
    ports:
      - "3308:3306" # distinto de Laragon (3307) y MySQL80 (3306)
    volumes:
      - mariadb_data:/var/lib/mysql # persistente: sobrevive a reinicios
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -p$$MARIADB_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  backend:
    build: ./backend
    container_name: agrotech-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-docker-local-solo}
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,backend
      DB_NAME: ${DB_NAME:-agrotech_db}
      DB_USER: ${DB_USER:-agrotech}
      DB_PASSWORD: ${DB_PASSWORD:-agrotech-docker-local}
      DB_HOST: db # nombre del servicio, NUNCA localhost
      DB_PORT: "3306"
      # Mismo origen vía Nginx (:8080): la cookie Lax viaja sin CORS cruzado.
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:8080,http://localhost:8080
      CSRF_TRUSTED_ORIGINS: http://127.0.0.1:8080,http://localhost:8080
      SESSION_COOKIE_SECURE: "False" # HTTP local; en prod HTTPS debe ser True
      CSRF_COOKIE_SECURE: "False" # HTTP local; en prod HTTPS debe ser True
      FRONTEND_URL: http://127.0.0.1:8080
      # Email: por defecto consola (sin SMTP). Para Gmail real definir en entorno
      # EMAIL_BACKEND=django.core.mail.backends.smtp.EmailBackend + HOST/PORT/TLS o SSL/USER/PASSWORD.
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-localhost}
      EMAIL_PORT: ${EMAIL_PORT:-1025}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-False}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-False}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-AGROTECH <no-reply@agrotech.local>}
    ports:
      - "8000:8000" # API directa (útil para diagnóstico; el flujo real usa :8080)
    volumes:
      - staticfiles:/app/staticfiles # collectstatic compartido con Nginx
    healthcheck:
      # Endpoint público existente (setea csrftoken, 200 sin auth). Sin inventar endpoints.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/auth/csrf/', timeout=5)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: "" # mismo origen: fetch relativo, Nginx proxya /api al backend
    container_name: agrotech-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80" # URL del frontend dockerizado
    volumes:
      - staticfiles:/usr/share/nginx/html/static:ro # estáticos Django del backend

volumes:
  mariadb_data:
  staticfiles:
